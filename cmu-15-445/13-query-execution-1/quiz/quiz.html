<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--background:#fff;--foreground:#18181b;--muted-foreground:#71717a;--card:#fafafa;--card-foreground:#18181b;--border:#e4e4e7;--ring:#a1a1aa;--secondary:#f4f4f5;--secondary-foreground:#27272a;--primary:#2563eb;--primary-foreground:#fff;--success:#16a34a;--destructive:#dc2626;--radius:10px;--font-sans:system-ui,-apple-system,sans-serif;--font-mono:ui-monospace,Menlo,monospace}
:root.dark{color-scheme:dark;--background:#09090b;--foreground:#fafafa;--muted-foreground:#a1a1aa;--card:#18181b;--card-foreground:#fafafa;--border:#27272a;--ring:#52525b;--secondary:#27272a;--secondary-foreground:#e4e4e7;--primary:#3b82f6;--success:#22c55e;--destructive:#ef4444}
body{background:var(--background);max-width:728px;margin:32px auto!important;padding:0 16px}

  body { margin: 0; font-family: var(--font-sans); color: var(--foreground); }
  .wrap { display: flex; flex-direction: column; gap: 14px; }
  .meta { font-size: 13px; color: var(--muted-foreground); display: flex; justify-content: space-between; align-items: center; }
  .score { font-family: var(--font-mono); font-size: 13px; }
  .theme { font: inherit; font-size: 12px; padding: 3px 9px; margin-left: 8px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--foreground); cursor: pointer; }
  .bar { height: 4px; background: var(--secondary); border-radius: 2px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--primary); width: 0; transition: width .25s; }
  .q { background: var(--card); color: var(--card-foreground); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .q h3 { margin: 0 0 4px; font-size: 15px; font-weight: 600; line-height: 1.4; }
  .q .ts { font-size: 12px; color: var(--muted-foreground); font-family: var(--font-mono); margin-bottom: 10px; }
  .opts { display: flex; flex-direction: column; gap: 6px; }
  button.opt { text-align: left; font: inherit; font-size: 14px; padding: 9px 12px; border-radius: calc(var(--radius) - 2px);
    border: 1px solid var(--border); background: var(--background); color: var(--foreground); cursor: pointer; line-height: 1.35; }
  button.opt:hover:not(:disabled) { border-color: var(--ring); }
  button.opt:disabled { cursor: default; }
  button.opt.right { border-color: var(--success); background: color-mix(in srgb, var(--success) 14%, transparent); }
  button.opt.wrong { border-color: var(--destructive); background: var(--destructive-surface, color-mix(in srgb, var(--destructive) 14%, transparent)); }
  button.opt.dim { opacity: .55; }
  .exp { display: none; margin-top: 10px; font-size: 13.5px; line-height: 1.5; padding: 10px 12px; border-radius: calc(var(--radius) - 2px); background: var(--secondary); color: var(--secondary-foreground); }
  .exp.show { display: block; }
  .exp b.ok { color: var(--success); } .exp b.no { color: var(--destructive); }
  .done { display: none; text-align: center; padding: 16px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--border); }
  .done.show { display: block; }
  .done .big { font-size: 28px; font-weight: 700; font-family: var(--font-mono); }
  .done button { margin-top: 10px; font: inherit; font-size: 13px; padding: 7px 14px; border-radius: calc(var(--radius) - 2px); border: 1px solid var(--border); background: var(--primary); color: var(--primary-foreground); cursor: pointer; }
</style></head>
<body>
<div class="wrap">
  <div class="meta"><span>CMU 15-445 #13: Query Execution Part 1</span><span><span class="score" id="score">0 / 0</span><button class="theme" id="theme"></button></span></div>
  <div class="bar"><div id="prog"></div></div>
  <div id="qs"></div>
  <div class="done" id="done"><div class="big" id="final"></div><div id="verdict" style="margin-top:4px;color:var(--muted-foreground);font-size:14px"></div><button id="retry">Retry</button></div>
</div>
<script>
const Q = [
 {ts:"6:15", q:"Which operator is a pipeline breaker, meaning it can't give its parent any output until it has all of its input?",
  o:["Filter (WHERE predicate)","Projection","Sort","Sequential scan"], a:2,
  e:"Sort can't say what comes first until it has seen everything. The hash join's build side is also a breaker: you can't probe until the hash table is complete, or you get false negatives."},
 {ts:"12:25", q:"In the iterator (Volcano) model, what does a call to next() return?",
  o:["All of the operator's output at once","One tuple, or null/EOF when there are no more","A batch of about 1024 tuples","A pointer to a buffer the scheduler fills"], a:1,
  e:"next() returns one tuple, or EOF, after which the parent never calls it again. open()/close() act like a constructor and destructor. Postgres, MySQL, SQLite, and BusTub (Project 3) use this model."},
 {ts:"21:20", q:"The materialization model passes ALL output up at once. What is its main weakness, and what is the main fix?",
  o:["Too many next() calls; fixed with SIMD","It passes huge intermediate results (a billion tuples for a LIMIT 10); fixed with operator fusion","It can't do joins; fixed with hash tables","It only works on disk; fixed with prefetching"], a:1,
  e:"It sends everything, so it wastes work when you need only a few results. Operator fusion pushes filters and projections down into the scan, so you discard data before passing it up. MonetDB (CWI) pioneered this model."},
 {ts:"26:15", q:"What workload does Pavlo say suits the materialization model?",
  o:["OLAP over billions of rows","In-memory OLTP that touches few tuples","Streaming","Approximate queries"], a:1,
  e:"OLTP queries touch few tuples and usually form a single pipeline, so fusing everything cuts the next() call overhead. Examples: early HyRise, and RavenDB. Almost no OLAP system uses it."},
 {ts:"27:20", q:"Why is the vectorized (batch) model the standard for OLAP?",
  o:["It sends the fewest bytes between operators","Fewer next() calls, plus tight branch-free loops over batches that can use SIMD or GPUs","It needs no buffer pool","It makes LIMIT easier than the iterator model does"], a:1,
  e:"It sits between the other two models: batches of about 1024 tuples (DuckDB). The model only became common around 2006–07, from the CWI researcher who went on to co-found Snowflake. Every modern OLAP system uses it."},
 {ts:"33:14", q:"In the push-based (bottom-to-top) plan direction, what drives execution?",
  o:["The root calls next() on its children","A scheduler runs pipelines as tasks in dependency order and tells each one where its input data is","Each leaf polls its parent","The optimizer runs operators inline"], a:1,
  e:"Control flow (the scheduler) is separate from data flow (the output buffers). Systems: HyPer and Umbra, plus DuckDB, which switched to push-based. The plan direction is independent of the processing model."},
 {ts:"49:38", q:"A block's zone map says min=100, max=400. The query is WHERE val > 600. What happens?",
  o:["Read the block and filter every tuple","Skip the block entirely, because nothing in it can match","Return an approximate count","Use the zone map as an index to find the exact tuples"], a:1,
  e:"Zone maps (also called SMAs, small materialized aggregates, from a 1998 paper) can only tell you whether a block might contain a match, not where the match is. Unlike approximate queries, they are always correct, so you should always use them."},
 {ts:"54:49", q:"A multi-index scan has an AND between two indexed predicates. How are the record IDs combined, and what does Postgres call this?",
  o:["Union; 'index merge'","Intersection; 'bitmap scan'","Intersection; 'index merge'","Union; 'bitmap scan'"], a:1,
  e:"AND (conjunction) uses intersection, and OR (disjunction) uses union. Postgres calls it a bitmap scan, and MySQL calls it an index merge. After the intersection, fetch the tuples and check the leftover predicates, such as country = 'US'."},
 {ts:"60:51", q:"What causes the Halloween problem?",
  o:["Queries running past midnight on Oct 31","An update moves a tuple's physical location, so the scan sees the same logical tuple again and updates it twice","Two transactions deleting the same row","A JIT bug in the WHERE clause"], a:1,
  e:"Andy's $999 salary gets +$100, the tuple moves further along the salary index, and the scan finds it again. System R researchers at IBM found this on Halloween in 1976, went drinking, and fixed it the next week. You must handle it in Project 3."},
 {ts:"72:27", q:"In the live demo, what does Postgres JIT-compile, and how did it compare to DuckDB?",
  o:["The whole plan, and it beat DuckDB","Only the WHERE-clause expressions; about 4s down to 2.7s, and DuckDB still finished in under 1s","Only joins; both took about 4s","The optimizer; DuckDB was slower"], a:1,
  e:"Postgres JIT-compiles the WHERE clause with LLVM, which added about 381ms of compile time. DuckDB uses a vectorized, push-based column store with no JIT and finished single-threaded in under 1 second. The lesson: a design made for OLAP beats a JIT added to a row store."},
 {ts:"75:26", q:"Computing UPPER('wu-tang') once and reusing the result for every tuple is called what?",
  o:["Common subexpression elimination","Constant folding","Operator fusion","Late materialization"], a:1,
  e:"Constant folding: evaluate it once and inject the result as a literal. Common subexpression elimination is a different technique: it reuses an identical subtree, such as the same STRPOS(...) on both sides of an OR."}
];
const L = "ABCD";
let answered = 0, correct = 0;
const qs = document.getElementById("qs");
function render() {
  answered = 0; correct = 0; qs.innerHTML = "";
  document.getElementById("done").classList.remove("show");
  update();
  Q.forEach((it, i) => {
    const d = document.createElement("div"); d.className = "q"; d.style.marginBottom = "12px";
    d.innerHTML = `<h3>${i+1}. ${it.q}</h3><div class="ts">around ${it.ts}</div><div class="opts"></div><div class="exp"></div>`;
    const opts = d.querySelector(".opts"), exp = d.querySelector(".exp");
    it.o.forEach((t, j) => {
      const b = document.createElement("button"); b.className = "opt"; b.textContent = `${L[j]}) ${t}`;
      b.onclick = () => {
        const btns = opts.querySelectorAll("button");
        btns.forEach((x, k) => { x.disabled = true; if (k === it.a) x.classList.add("right"); else if (k === j) x.classList.add("wrong"); else x.classList.add("dim"); });
        const ok = j === it.a; answered++; if (ok) correct++;
        exp.innerHTML = `<b class="${ok?'ok':'no'}">${ok?'Correct.':'Not quite. The answer is '+L[it.a]+'.'}</b> ${it.e}`;
        exp.classList.add("show"); update();
      };
      opts.appendChild(b);
    });
    qs.appendChild(d);
  });
}
function update() {
  document.getElementById("score").textContent = `${correct} / ${answered}`;
  document.getElementById("prog").style.width = (answered / Q.length * 100) + "%";
  if (answered === Q.length) {
    document.getElementById("final").textContent = `${correct} / ${Q.length}`;
    document.getElementById("verdict").textContent = correct === Q.length ? "Perfect score. Ready for Project 3." : correct >= 8 ? "Solid. Rewatch the timestamps for the ones you missed." : "Worth another watch, starting from the questions you missed.";
    document.getElementById("done").classList.add("show");
  }
}
document.getElementById("retry").onclick = render;
const root = document.documentElement, themeBtn = document.getElementById("theme");
function setTheme(dark) {
  root.classList.toggle("dark", dark);
  themeBtn.textContent = dark ? "☀ Light" : "☾ Dark";
  try { localStorage.setItem("quiz-theme", dark ? "dark" : "light"); } catch {}
}
themeBtn.onclick = () => setTheme(!root.classList.contains("dark"));
// Storage can be blocked (privacy settings); fall back to light instead of breaking the quiz.
let saved = null; try { saved = localStorage.getItem("quiz-theme"); } catch {}
setTheme(saved === "dark");
render();
</script>
</body></html>
